<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker with Notes</title>

<style>
:root {
  --green:#4caf50;
  --red:#e53935;
  --bg1:#667eea;
  --bg2:#764ba2;
  --card:#ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  min-height: 100vh;
  padding: 16px;
}

.container {
  max-width: 1200px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #fff;
  margin-bottom: 16px;
}

/* ADD HABIT */
.add {
  background: var(--card);
  padding: 14px;
  border-radius: 14px;
  display: grid;
  grid-template-columns: 1fr 120px auto;
  gap: 10px;
  margin-bottom: 20px;
}

.add input, .add button {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

.add button {
  background: var(--bg1);
  color: white;
  border: none;
  cursor: pointer;
}

/* HABITS */
.habits {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}

.habit {
  background: var(--card);
  padding: 14px;
  border-radius: 16px;
  box-shadow: 0 10px 20px rgba(0,0,0,.15);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-weight: 700;
  font-size: 18px;
}

.delete {
  cursor: pointer;
  color: var(--red);
  font-size: 18px;
}

/* PROGRESS */
.progress {
  margin: 12px 0;
}

.bar {
  height: 10px;
  background: #ddd;
  border-radius: 5px;
  overflow: hidden;
}

.fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), #81c784);
}

.percent {
  text-align: right;
  font-size: 14px;
}

/* DAYS */
.days {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(36px, 1fr));
  gap: 6px;
}

.day {
  aspect-ratio: 1/1;
  display: grid;
  place-items: center;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  color: #fff;
  background: var(--red);
  position: relative;
}

.day.checked {
  background: var(--green);
}

/* NOTE INDICATOR */
.day.has-note::after {
  content: "📝";
  position: absolute;
  bottom: 2px;
  right: 4px;
  font-size: 12px;
}

/* NOTE MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: none;
  place-items: center;
  z-index: 10;
}

.modal-content {
  background: #fff;
  padding: 16px;
  border-radius: 14px;
  width: min(90%, 400px);
}

.modal textarea {
  width: 100%;
  height: 120px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  resize: none;
}

.modal button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: var(--bg1);
  color: white;
  cursor: pointer;
}

@media (max-width: 500px) {
  .add {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>🔥 Habit Tracker (with Notes)</h1>

  <div class="add">
    <input id="name" placeholder="Habit name">
    <input id="days" type="number" min="1" placeholder="Days">
    <button onclick="addHabit()">Add</button>
  </div>

  <div class="habits" id="habits"></div>
</div>

<!-- NOTE MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Day Note</h3>
    <textarea id="noteText" placeholder="Write your note..."></textarea>
    <button onclick="saveNote()">Save Note</button>
  </div>
</div>

<script>
let habits = JSON.parse(localStorage.getItem("habits")) || [];
let currentHabit = null;
let currentDay = null;

function save() {
  localStorage.setItem("habits", JSON.stringify(habits));
}

function addHabit() {
  const name = document.getElementById("name").value.trim();
  const days = +document.getElementById("days").value;
  if (!name || !days) return;

  habits.push({
    name,
    days,
    checks: Array(days).fill(false),
    notes: Array(days).fill("")
  });

  document.getElementById("name").value = "";
  document.getElementById("days").value = "";
  save();
  render();
}

function toggle(h, d) {
  habits[h].checks[d] = !habits[h].checks[d];
  save();
  render();
}

function openNote(h, d) {
  currentHabit = h;
  currentDay = d;
  document.getElementById("noteText").value =
    habits[h].notes[d] || "";
  document.getElementById("modal").style.display = "grid";
}

function saveNote() {
  habits[currentHabit].notes[currentDay] =
    document.getElementById("noteText").value;
  document.getElementById("modal").style.display = "none";
  save();
  render();
}

function removeHabit(i) {
  if (!confirm("Delete habit?")) return;
  habits.splice(i, 1);
  save();
  render();
}

function render() {
  const el = document.getElementById("habits");
  el.innerHTML = "";

  habits.forEach((h, hi) => {
    const done = h.checks.filter(Boolean).length;
    const pct = Math.round((done / h.days) * 100);

    el.innerHTML += `
      <div class="habit">
        <div class="header">
          <div class="title">${h.name}</div>
          <div class="delete" onclick="removeHabit(${hi})">✖</div>
        </div>

        <div class="progress">
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
          <div class="percent">${pct}%</div>
        </div>

        <div class="days">
          ${h.checks.map((c, di) => `
            <div class="day ${c ? "checked":""} ${h.notes[di] ? "has-note":""}"
              onclick="toggle(${hi},${di})"
              ondblclick="openNote(${hi},${di})">
              ${di+1}
            </div>
          `).join("")}
        </div>
        <small>Tip: double-click / long-press day to add note</small>
      </div>
    `;
  });
}

document.getElementById("modal").onclick = e => {
  if (e.target.id === "modal") e.target.style.display = "none";
};

render();
</script>

</body>
</html>
