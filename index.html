<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🟢Habit-Tracker🔴</title>

<style>
:root {
  --green:#26a01b;
  --red:#ea2a6a;
  --bg1:#667eea;
  --bg2:#0f0107;
  --card:#efeff4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  min-height: 100vh;
  padding: 16px;
}

.container {
  max-width: 1200px;
  margin: auto;
}

h1 {
  text-align: center;
  color: hwb(180 96% 3%);
  margin-bottom: 10px;
}

/* TOP BAR */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  margin-bottom: 12px;
  gap:6px;
}

.top-bar button, #importFile {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #fff;
  font-size: 16px;
  cursor: pointer;
}

/* ADD HABIT */
.add {
  background: var(--card);
  padding: 14px;
  border-radius: 14px;
  display: grid;
  grid-template-columns: 1fr 120px auto;
  gap: 10px;
  margin-bottom: 20px;
}

.add input, .add button {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.add button {
  background: var(--bg1);
  color: white;
  border: none;
}

/* SORT DROPDOWN */
.sort-container {
  margin-bottom: 12px;
}

.sort-container label {
  color: #fff;
  font-weight: 600;
  margin-right: 6px;
}

.sort-container select {
  padding:6px 10px;
  border-radius:6px;
  border:none;
  font-size:16px;
}

/* HABITS GRID */
.habits {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}

/* HABIT CARD */
.habit {
  background: var(--card);
  padding: 14px;
  border-radius: 16px;
  box-shadow: 0 10px 20px rgba(0,0,0,.15);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-weight: 700;
  font-size: 18px;
}

.delete {
  cursor: pointer;
  color: var(--red);
  font-size: 18px;
}

/* PROGRESS */
.bar {
  background: #ddd;
  height: 10px;
  border-radius: 5px;
  overflow: hidden;
  margin: 10px 0 4px;
}

.fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), #81c784);
}

.percent {
  text-align: right;
  font-size: 14px;
}

/* DAYS */
.days {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(36px, 1fr));
  gap: 6px;
}

/* DAY BOX (SQUARE) */
.day {
  width: 100%;
  position: relative;
  cursor: pointer;
  font-weight: 600;
  color: #fff;
  background: var(--red);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.day::before {
  content: "";
  display: block;
  padding-top: 100%; /* maintains square */
}

.day > * {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.day.checked {
  background: var(--green);
}

.day.has-note::after {
  content: "📝";
  position: absolute;
  bottom: 2px;
  right: 4px;
  font-size: 12px;
}

/* MODALS */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  place-items: center;
  z-index: 10;
}

.modal-content {
  background: #fff;
  padding: 16px;
  border-radius: 14px;
  width: min(92%, 420px);
  max-height: 80vh;
  overflow-y: auto;
}

.modal textarea {
  width: 100%;
  height: 120px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  resize: none;
  font-size: 16px;
}

.modal button {
  margin-top: 10px;
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: var(--bg1);
  color: white;
  font-size: 16px;
}

/* MOBILE */
@media (max-width: 500px) {
  .add {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>🟢Habit-Tracker🔴</h1>

  <div class="top-bar">
    <button onclick="openInstructions()">📘 Instructions</button>
    <button onclick="openTrash()">🗑 Trash</button>
    <button onclick="exportData()">⬇ Export</button>
    <input type="file" id="importFile" accept="application/json" onchange="importData(event)">
  </div>

  <div class="add">
    <input id="name" placeholder="Habit name">
    <input id="days" type="number" min="1" placeholder="Days">
    <button onclick="addHabit()">Add</button>
  </div>

  <div class="sort-container">
    <label for="sortSelect">Sort by:</label>
    <select id="sortSelect" onchange="render()">
      <option value="none">None</option>
      <option value="pct-desc">Completion % ↓</option>
      <option value="name-asc">Name A→Z</option>
      <option value="name-desc">Name Z→A</option>
    </select>
  </div>

  <div class="habits" id="habits"></div>
</div>

<!-- NOTE MODAL -->
<div class="modal" id="noteModal">
  <div class="modal-content">
    <h3>Day Note</h3>
    <textarea id="noteText" placeholder="Write your note..."></textarea>
    <button onclick="saveNote()">Save</button>
  </div>
</div>

<!-- INSTRUCTIONS MODAL -->
<div class="modal" id="helpModal">
  <div class="modal-content">
    <h3>📘 How to Use</h3>
    <ul>
      <li>➕ Add multiple habits/events</li>
      <li>🟢 Green = Done, 🔴 Red = Not Done</li>
      <li>👆 Tap a day to mark done</li>
      <li>📝 Long-press or double-tap a day to add a note</li>
      <li>💾 Everything auto-saves</li>
      <li>🗑 Deleted habits go to Trash</li>
      <li>⬇ Export and 📤 Import JSON backups</li>
    </ul>
    <button onclick="closeInstructions()">Close</button>
  </div>
</div>

<!-- TRASH MODAL -->
<div class="modal" id="trashModal">
  <div class="modal-content">
    <h3>🗑 Trash</h3>
    <div id="trashList" style="margin-bottom:10px;"></div>
    <button onclick="clearTrash()">Clear Trash</button>
    <button onclick="closeTrash()" style="margin-top:6px;">Close</button>
  </div>
</div>

<script>
let habits = JSON.parse(localStorage.getItem("habits")) || [];
let trash = JSON.parse(localStorage.getItem("trash")) || [];
let currentHabit = null;
let currentDay = null;

function save() {
  localStorage.setItem("habits", JSON.stringify(habits));
  localStorage.setItem("trash", JSON.stringify(trash));
}

function addHabit() {
  const name = document.getElementById("name").value.trim();
  const days = +document.getElementById("days").value;
  if (!name || !days) return;

  habits.push({ name, days, checks: Array(days).fill(false), notes: Array(days).fill("") });
  document.getElementById("name").value = "";
  document.getElementById("days").value = "";
  save();
  render();
}

function toggle(h, d) {
  habits[h].checks[d] = !habits[h].checks[d];
  save();
  render();
}

function openNote(h, d) {
  currentHabit = h;
  currentDay = d;
  document.getElementById("noteText").value = habits[h].notes[d];
  document.getElementById("noteModal").style.display = "grid";
}

function saveNote() {
  habits[currentHabit].notes[currentDay] = document.getElementById("noteText").value;
  document.getElementById("noteModal").style.display = "none";
  save();
  render();
}

function openInstructions() { document.getElementById("helpModal").style.display = "grid"; }
function closeInstructions() { document.getElementById("helpModal").style.display = "none"; }

function addLongPress(el, h, d) {
  let timer;
  const open = () => openNote(h,d);
  el.addEventListener("pointerdown", () => timer = setTimeout(open, 600));
  el.addEventListener("pointerup", () => clearTimeout(timer));
  el.addEventListener("pointerleave", () => clearTimeout(timer));
}

// --- TRASH ---
function deleteHabit(hIndex) {
  trash.push(habits[hIndex]);
  habits.splice(hIndex,1);
  save();
  render();
}

function openTrash() {
  const trashModal = document.getElementById("trashModal");
  const trashList = document.getElementById("trashList");
  trashList.innerHTML = "";
  if(trash.length === 0) {
    trashList.textContent = "Trash is empty.";
  } else {
    trash.forEach(h => {
      const div = document.createElement("div");
      div.textContent = `${h.name} (${h.days} days)`;
      trashList.appendChild(div);
    });
  }
  trashModal.style.display = "grid";
}

function closeTrash() { document.getElementById("trashModal").style.display = "none"; }
function clearTrash() { trash=[]; save(); openTrash(); }

// --- IMPORT / EXPORT ---
function exportData() {
  const data = { habits, trash };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'habit-tracker-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(data.habits && data.trash){
        habits = data.habits;
        trash = data.trash;
        save();
        render();
        alert('Import successful!');
      } else alert('Invalid JSON file!');
    } catch(e) { alert('Failed to import: '+e); }
  };
  reader.readAsText(file);
  event.target.value = ""; // reset file input
}

// --- RENDER ---
function render() {
  const el = document.getElementById("habits");
  el.innerHTML = "";

  const sortValue = document.getElementById("sortSelect")?.value || "none";
  let sortedHabits = [...habits];

  if(sortValue === "pct-desc") sortedHabits.sort((a,b) => (b.checks.filter(Boolean).length/b.days) - (a.checks.filter(Boolean).length/a.days));
  else if(sortValue === "name-asc") sortedHabits.sort((a,b) => a.name.localeCompare(b.name));
  else if(sortValue === "name-desc") sortedHabits.sort((a,b) => b.name.localeCompare(a.name));

  sortedHabits.forEach((h) => {
    const done = h.checks.filter(Boolean).length;
    const pct = Math.round((done / h.days) * 100);
    const habitEl = document.createElement("div");
    habitEl.className="habit";
    habitEl.innerHTML = `
      <div class="header">
        <div class="title">${h.name}</div>
        <div class="delete">✖</div>
      </div>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      <div class="percent">${pct}%</div>
      <div class="days"></div>
    `;
    el.appendChild(habitEl);

    habitEl.querySelector(".delete").onclick = () => deleteHabit(habits.indexOf(h));

    const daysDiv = habitEl.querySelector(".days");
    h.checks.forEach((c, di) => {
      const day = document.createElement("div");
      day.className = "day"+(c?" checked":"")+(h.notes[di]?" has-note":"");
      day.textContent = di+1;
      day.onclick = () => toggle(habits.indexOf(h), di);
      day.ondblclick = () => openNote(habits.indexOf(h), di);
      addLongPress(day, habits.indexOf(h), di);
      daysDiv.appendChild(day);
    });
  });
}

// Close modals on outside click
document.querySelectorAll(".modal").forEach(m => m.onclick = e => { if(e.target===m)m.style.display="none"; });

render();
</script>
</body>
</html>
