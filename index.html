<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Habit Tracker</title>

<style>
:root {
  --green:#4caf50;
  --red:#e53935;
  --bg1:#667eea;
  --bg2:#764ba2;
  --card:#ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  min-height: 100vh;
  padding: 16px;
}

.container {
  max-width: 1200px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #fff;
  margin-bottom: 10px;
}

/* TOP BAR */
.top-bar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}

.top-bar button {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #fff;
  font-size: 16px;
  cursor: pointer;
}

/* ADD HABIT */
.add {
  background: var(--card);
  padding: 14px;
  border-radius: 14px;
  display: grid;
  grid-template-columns: 1fr 120px auto;
  gap: 10px;
  margin-bottom: 20px;
}

.add input, .add button {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.add button {
  background: var(--bg1);
  color: white;
  border: none;
}

/* SORT DROPDOWN */
.sort-container {
  margin-bottom: 12px;
}

.sort-container label {
  color: #fff;
  font-weight: 600;
  margin-right: 6px;
}

.sort-container select {
  padding:6px 10px;
  border-radius:6px;
  border:none;
  font-size:16px;
}

/* HABITS GRID */
.habits {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}

/* HABIT CARD */
.habit {
  background: var(--card);
  padding: 14px;
  border-radius: 16px;
  box-shadow: 0 10px 20px rgba(0,0,0,.15);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-weight: 700;
  font-size: 18px;
}

.delete {
  cursor: pointer;
  color: var(--red);
  font-size: 18px;
}

/* PROGRESS */
.bar {
  background: #ddd;
  height: 10px;
  border-radius: 5px;
  overflow: hidden;
  margin: 10px 0 4px;
}

.fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), #81c784);
}

.percent {
  text-align: right;
  font-size: 14px;
}

/* DAYS */
.days {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(36px, 1fr));
  gap: 6px;
}

/* DAY BOX (SQUARE) */
.day {
  width: 100%;
  position: relative;
  cursor: pointer;
  font-weight: 600;
  color: #fff;
  background: var(--red);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.day::before {
  content: "";
  display: block;
  padding-top: 100%; /* maintains square */
}

.day > * {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.day.checked {
  background: var(--green);
}

.day.has-note::after {
  content: "📝";
  position: absolute;
  bottom: 2px;
  right: 4px;
  font-size: 12px;
}

/* MODALS */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  place-items: center;
  z-index: 10;
}

.modal-content {
  background: #fff;
  padding: 16px;
  border-radius: 14px;
  width: min(92%, 420px);
  max-height: 80vh;
  overflow-y: auto;
}

.modal textarea {
  width: 100%;
  height: 120px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  resize: none;
  font-size: 16px;
}

.modal button {
  margin-top: 10px;
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: var(--bg1);
  color: white;
  font-size: 16px;
}

/* MOBILE */
@media (max-width: 500px) {
  .add {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>🔥 Habit Tracker</h1>

  <div class="top-bar">
    <button onclick="openInstructions()">📘 Instructions</button>
  </div>

  <div class="add">
    <input id="name" placeholder="Habit name">
    <input id="days" type="number" min="1" placeholder="Days">
    <button onclick="addHabit()">Add</button>
  </div>

  <!-- Sorting -->
  <div class="sort-container">
    <label for="sortSelect">Sort by:</label>
    <select id="sortSelect" onchange="render()">
      <option value="none">None</option>
      <option value="pct-desc">Completion % ↓</option>
      <option value="name-asc">Name A→Z</option>
      <option value="name-desc">Name Z→A</option>
    </select>
  </div>

  <div class="habits" id="habits"></div>
</div>

<!-- NOTE MODAL -->
<div class="modal" id="noteModal">
  <div class="modal-content">
    <h3>Day Note</h3>
    <textarea id="noteText" placeholder="Write your note..."></textarea>
    <button onclick="saveNote()">Save</button>
  </div>
</div>

<!-- INSTRUCTIONS MODAL -->
<div class="modal" id="helpModal">
  <div class="modal-content">
    <h3>📘 How to Use</h3>
    <ul>
      <li>➕ Add multiple habits/events</li>
      <li>🟢 Green = Done, 🔴 Red = Not Done</li>
      <li>👆 Tap a day to mark done</li>
      <li>📝 Long-press or double-tap a day to add a note</li>
      <li>💾 Everything auto-saves</li>
    </ul>
    <button onclick="closeInstructions()">Close</button>
  </div>
</div>

<script>
let habits = JSON.parse(localStorage.getItem("habits")) || [];
let currentHabit = null;
let currentDay = null;

function save() {
  localStorage.setItem("habits", JSON.stringify(habits));
}

function addHabit() {
  const name = document.getElementById("name").value.trim();
  const days = +document.getElementById("days").value;
  if (!name || !days) return;

  const checks = [];
  const notes = [];
  for(let i=0;i<days;i++){
    checks.push(false);
    notes.push("");
  }

  habits.push({ name, days, checks, notes });
  document.getElementById("name").value = "";
  document.getElementById("days").value = "";
  save();
  render();
}

function toggle(h, d) {
  habits[h].checks[d] = !habits[h].checks[d];
  save();
  render();
}

function openNote(h, d) {
  currentHabit = h;
  currentDay = d;
  document.getElementById("noteText").value = habits[h].notes[d];
  document.getElementById("noteModal").style.display = "grid";
}

function saveNote() {
  habits[currentHabit].notes[currentDay] =
    document.getElementById("noteText").value;
  document.getElementById("noteModal").style.display = "none";
  save();
  render();
}

function openInstructions() {
  document.getElementById("helpModal").style.display = "grid";
}

function closeInstructions() {
  document.getElementById("helpModal").style.display = "none";
}

function addLongPress(el, h, d) {
  let timer;
  const open = () => openNote(h,d);
  el.addEventListener("pointerdown", () => timer = setTimeout(open, 600));
  el.addEventListener("pointerup", () => clearTimeout(timer));
  el.addEventListener("pointerleave", () => clearTimeout(timer));
}

function render() {
  const el = document.getElementById("habits");
  el.innerHTML = "";

  const sortValue = document.getElementById("sortSelect")?.value || "none";
  let sortedHabits = [...habits];

  if(sortValue === "pct-desc") {
    sortedHabits.sort((a,b) => (b.checks.filter(Boolean).length/a.days) - (a.checks.filter(Boolean).length/b.days));
  } else if(sortValue === "name-asc") {
    sortedHabits.sort((a,b) => a.name.localeCompare(b.name));
  } else if(sortValue === "name-desc") {
    sortedHabits.sort((a,b) => b.name.localeCompare(a.name));
  }

  sortedHabits.forEach((h, hi) => {
    const done = h.checks.filter(Boolean).length;
    const pct = Math.round((done / h.days) * 100);

    const habitEl = document.createElement("div");
    habitEl.className = "habit";
    habitEl.innerHTML = `
      <div class="header">
        <div class="title">${h.name}</div>
        <div class="delete">✖</div>
      </div>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
      <div class="percent">${pct}%</div>
      <div class="days"></div>
    `;
    el.appendChild(habitEl);

    habitEl.querySelector(".delete").onclick = () => {
      const origIndex = habits.indexOf(h);
      if(origIndex > -1) {
        habits.splice(origIndex,1);
        save();
        render();
      }
    };

    const daysDiv = habitEl.querySelector(".days");
    h.checks.forEach((c, di) => {
      const day = document.createElement("div");
      day.className = "day" + (c?" checked":"") + (h.notes[di]?" has-note":"");
      day.textContent = di+1;
      day.onclick = () => toggle(habits.indexOf(h), di);
      day.ondblclick = () => openNote(habits.indexOf(h), di);
      addLongPress(day, habits.indexOf(h), di);
      daysDiv.appendChild(day);
    });
  });
}

// Close modal on click outside
document.querySelectorAll(".modal").forEach(m =>
  m.onclick = e => { if(e.target === m) m.style.display="none"; }
);

render();
</script>

</body>
</html>
